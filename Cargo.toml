[package]
name = "rpm"
version = "1.0.0"
edition = "2021"
authors = ["Gus Cavalcante <nowayhecodes@gmail.com>"]
description = "A fast, secure Node.js package manager written in Rust"
license = "MIT"
repository = "https://github.com/nowayhecodes/rpm"
homepage = "https://github.com/nowayhecodes/rpm"
documentation = "https://github.com/nowayhecodes/rpm#readme"
readme = "README.md"
keywords = ["node", "npm", "package-manager", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.75"
exclude = [".github/", ".idea/", "target/"]

[lib]
name = "rpm"
path = "src/lib.rs"

[[bin]]
name = "rpm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-semver = "0.2.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
semver = "1.0"
sha2 = "0.10"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
url = "2.5"
tempfile = "3.10"
tar = "0.4"
flate2 = "1.0"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
tokio-util = "0.7"
hex = "0.4"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
mockall = "0.12"
